name: lifecli_app
description: LifeCLI — Life management app for Bangladeshi university students
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0

  # Auth & Sync
  google_sign_in: ^7.0.0
  googleapis: ^13.1.0
  googleapis_auth: ^1.5.1
  http: ^1.2.1

  # Local DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.1.4

  # Charts
  fl_chart: ^0.68.0

  # Notifications
  flutter_local_notifications: ^17.2.1+2
  timezone: ^0.9.4

  # HTTP
  dio: ^5.4.3+1

  # Speech Input
  speech_to_text: ^6.6.2

  # Sharing
  share_plus: ^12.0.2

  # Background tasks
  workmanager: ^0.5.2

  # Fonts
  google_fonts: ^6.2.1

  # Misc utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_staggered_animations: ^1.1.1
  table_calendar: ^3.1.2
  math_expressions: ^2.6.0
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.2
  shared_preferences: ^2.3.1
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  animations: ^2.0.11
  collection: ^1.18.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/sounds/
    - assets/icon/
